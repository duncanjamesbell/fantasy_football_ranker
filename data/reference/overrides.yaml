# ---------------------------------------------------------------------------
# Team name character fixes
# Yahoo sometimes stores team names with Unicode right-single-quote (U+2019)
# which breaks string matching. These substitutions are applied before any
# name-based joins.
# ---------------------------------------------------------------------------
team_name_fixes:
  - raw: "’"      # right single quotation mark '
    replace: "'"       # standard apostrophe
