# overrides.yaml
# Manual corrections applied on top of the automated pipeline output.
# The pipeline reads this file and applies these overrides so that the
# canonical consolidated_master.csv is always reproducible — no more
# date-stamped "revised" CSV variants.

# ---------------------------------------------------------------------------
# League size overrides
# Auto-detection uses manager count from standings. These force specific values
# for seasons where the roster was smaller (affects playoff win calculation
# and rank weight lookup in metrics/composite.py).
# ---------------------------------------------------------------------------
league_sizes:
  2007: 6
  2009: 8
  # 2010+ default: 10

# ---------------------------------------------------------------------------
# Manager/team exclusions
# Entries in standings that should be ignored entirely (co-managers counted
# under another manager, test entries, etc.)
# ---------------------------------------------------------------------------
exclude_manager_seasons:
  - season: 2010
    team_name: "Oober Gey"
    reason: "Scott co-manager on Luke's account; counted under Luke"

